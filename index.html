<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SURAKSHINI AI — Making Every Conversation Safer with AI</title>
    <meta
      name="description"
      content="Making Every Conversation Safer with AI. A multilingual cyberbullying detection, screenshot analysis, and digital safety conversational assistant supporting Kannada, Kanglish, and English."
    />
    <meta property="og:title" content="SURAKSHINI AI — Making Every Conversation Safer with AI" />
    <meta
      property="og:description"
      content="Multilingual cyberbullying detection, screenshot analysis, and empathetic digital safety assistant supporting Kannada, Kanglish, and English."

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('chatbot-theme');
          if (saved === 'white' || saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#FFFFFF] text-[#0F172A] dark:bg-[#0F172A] dark:text-[#F8FAFC] antialiased transition-colors duration-200 selection:bg-[#3B82F6]/20 selection:text-[#0F172A] dark:selection:bg-[#3B82F6]/30 dark:selection:text-[#F8FAFC]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
